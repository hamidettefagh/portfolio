# Reruns the site agent's golden set against production after every successful
# production deploy. It runs after the deploy is live, so a failure marks the
# deploy in GitHub rather than blocking it. It calls the public endpoint and
# needs no API key; the optional EVAL_DENYLIST secret turns on the client-name
# check. Each run's raw results are kept as a downloadable artifact.
name: Site agent evals

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Give the new deploy a moment to take the domain
        run: sleep 30
      - name: Run the golden set against production
        env:
          EVAL_DENYLIST: ${{ secrets.EVAL_DENYLIST }}
        run: node scripts/eval-site-agent.mjs --url https://hamidettefagh.com --out eval-results.json
      - name: Keep the raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-agent-evals
          path: eval-results.json
          if-no-files-found: ignore
          retention-days: 90
