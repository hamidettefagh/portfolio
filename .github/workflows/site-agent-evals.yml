# Reruns the site agent's golden set against production after every successful
# production deploy, and fails when a hard check fails or soft checks drop
# below 85 percent. It calls the public endpoint, so it needs no API key. The
# optional EVAL_DENYLIST secret turns on the client-name check.
name: Site agent evals

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Give the new deploy a moment to take the domain
        run: sleep 30
      - name: Run the golden set against production
        env:
          EVAL_DENYLIST: ${{ secrets.EVAL_DENYLIST }}
        run: node scripts/eval-site-agent.mjs --url https://hamidettefagh.com --no-write
